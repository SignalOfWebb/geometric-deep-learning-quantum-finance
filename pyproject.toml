[project]
name = "gdl-quantum-finance"
version = "0.1.0"
description = "Geometric deep learning for quantum-inspired financial market dynamics."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "eodhd>=1.0.32",
    "fastparquet>=2025.12.0",
    "geomstats>=2.8.0",
    "matplotlib>=3.10.8",
    "pandas>=2.3.3",
    "pyarrow>=22.0.0",
    "pyyaml>=6.0.3",
    "requests>=2.32.5",
    "torch>=2.10.0",
    "torch-geometric>=2.7.0",
    "tqdm>=4.67.1",
    "wandb>=0.24.2",
    "yfinance>=1.0",
]

[dependency-groups]
dev = [
    "pydeps>=3.0.2",
    "pytest>=9.0.2",
]
